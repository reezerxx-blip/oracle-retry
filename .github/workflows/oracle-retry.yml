name: Oracle - creer la machine

on:
  schedule:
    - cron: "*/10 * * * *"   # toutes les 10 minutes
  workflow_dispatch:          # bouton "Run workflow" pour lancer a la main

permissions:
  actions: write

concurrency:
  group: oracle-retry
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      OCI_CLI_USER: ${{ secrets.OCI_USER }}
      OCI_CLI_TENANCY: ${{ secrets.OCI_TENANCY }}
      OCI_CLI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_CLI_KEY_FILE: /home/runner/oci_key.pem
      OCI_CLI_REGION: eu-paris-1
      STACK: ${{ secrets.OCI_STACK_ID }}
    steps:
      - name: Installer l'outil Oracle (OCI CLI)
        run: pip install --quiet oci-cli

      - name: Preparer la cle
        env:
          KEY: ${{ secrets.OCI_PRIVATE_KEY }}
        run: |
          printf '%s\n' "$KEY" | tr -d '\r' | sed -n '/-----BEGIN/,/-----END/p' > "$OCI_CLI_KEY_FILE"
          chmod 600 "$OCI_CLI_KEY_FILE"
          echo "Lignes dans la cle : $(wc -l < "$OCI_CLI_KEY_FILE")"
          grep -q "BEGIN PRIVATE KEY\|BEGIN RSA PRIVATE KEY" "$OCI_CLI_KEY_FILE" && echo "Cle privee OK" || echo "ATTENTION : ce n'est pas une cle PRIVEE"

      - name: Deja reussi ? Alors on ne fait rien
        id: check
        run: |
          OK=$(oci resource-manager job list --stack-id "$STACK" --all \
            --query "length(data[?operation=='APPLY' && \"lifecycle-state\"=='SUCCEEDED'])" \
            --raw-output)
          echo "Jobs reussis : $OK"
          if [ "$OK" != "0" ]; then
            echo "La machine existe deja. Pense a desactiver ce workflow."
            echo "done=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Essayer de creer la machine
        id: try
        if: steps.check.outputs.done != 'true'
        run: |
          STATE=$(oci resource-manager job create-apply-job --stack-id "$STACK" \
            --execution-plan-strategy AUTO_APPROVED \
            --wait-for-state SUCCEEDED --wait-for-state FAILED \
            --max-wait-seconds 420 \
            --query 'data."lifecycle-state"' --raw-output || true)
          echo "Resultat : $STATE"
          if [ "$STATE" = "SUCCEEDED" ]; then
            echo "MACHINE CREEE !"
            echo "created=true" >> "$GITHUB_OUTPUT"
          else
            echo "Pas de place pour l'instant, nouvel essai dans 10 min."
          fi

      - name: "URGENT URGENT - MACHINE ORACLE CREEE"
        if: steps.try.outputs.created == 'true' || steps.check.outputs.done == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow disable oracle-retry.yml --repo "$GITHUB_REPOSITORY" || true
          echo "::error title=URGENT URGENT::MACHINE ORACLE CREEE ! Va sur Oracle > Compute > Instances. Les essais sont arretes."
          exit 1
